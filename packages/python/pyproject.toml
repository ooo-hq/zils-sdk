[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zils-sdk"
version = "0.4.13"
description = "Python SDK and MCP for Zils decisions, plus account and training CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["typesafe-sdk==0.7.2", "httpx==0.28.1"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
merge = ["numpy>=1.26"]

[project.scripts]
zils = "zils_sdk.cli:main"
zils-mcp = "zils_sdk.mcp:main"

[project.urls]
Homepage = "https://zils.ai"
Repository = "https://github.com/ooo-hq/zils-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zils_sdk = ["py.typed", "skills/*/SKILL.md"]
