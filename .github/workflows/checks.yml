name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: "3.11"
            node: "20"
          - python: "3.13"
            node: "22"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install -r requirements/dev.txt "./packages/python[mcp]"
      - run: npm ci --prefix packages/typescript
      - run: make check PYTHON=python
      - run: python -m build packages/python
      - run: |
          mkdir -p .private
          npm pack ./packages/typescript --pack-destination .private
  npm-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: python -m pip install build
      - name: Pack and install without lifecycle scripts
        shell: bash
        env:
          ZILS_PYTHON: python
        run: |
          mkdir -p .private/installed
          npm pack ./packages/cli --pack-destination .private
          npm install --prefix .private/installed --ignore-scripts ./.private/zils-cli-*.tgz
      - name: Exercise the installed CLI
        env:
          ZILS_TEST_BIN: ${{ github.workspace }}/.private/installed/node_modules/@zils/cli/bin/zils.cjs
          ZILS_PYTHON: python
        run: npm test --prefix packages/cli
